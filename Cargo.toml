[package]
name = "spud"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "Cross-platform remote control application optimised for gaming"
license = "GPL-3.0"
repository = "https://github.com/xfoa/spud"
authors = ["foax <a@fo.ax>"]

[package.metadata.bundle]
name = "Spud"
identifier = "ax.fo.spud"
icon = ["resources/icon.png"]
copyright = "GPL-3.0"
category = "public.app-category.utilities"
short_description = "Cross-platform remote control application optimised for gaming"
long_description = """
Spud sends local input (keyboard and mouse) to a remote server over LAN.
It is optimised for gaming, with tunable protocol parameters for latency
and reliability. No video or audio is streamed back.
"""
linux_use_terminal = false

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tokio", "tiny-skia", "crisp", "web-colors", "image-without-codecs", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mdns-sd = "0.19.2"
if-addrs = "0.15.0"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0.0"
open = "5.3.5"
argon2 = "0.5"
base64ct = { version = "1", features = ["alloc"] }
getrandom = "0.4.2"
fastrand = "2"
aes-gcm = "0.10"
hkdf = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
dashmap = "6.2.1"
postcard = { version = "1.1", features = ["use-std"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.14.8", features = ["pem"] }
x509-parser = "0.18.1"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
raw-window-handle = "0.6"
libc = "0.2"
kinput = "0.3"
evdev = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
